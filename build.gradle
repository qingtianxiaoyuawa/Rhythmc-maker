plugins {
    id "fabric-loom" version "1.15.3"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
    maven { name = "Wisp Forest"; url = "https://maven.wispforest.io/releases/" }
    mavenCentral()
    maven { name = "JitPack"; url = "https://jitpack.io" }
    maven { name = "EngineHub"; url = "https://maven.enginehub.org/repo/" }
    flatDir { dirs "libs" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    include modImplementation("io.wispforest:owo-lib:${project.owo_version}")
    include implementation("org.yaml:snakeyaml:2.4")
    include implementation("com.github.luben:zstd-jni:1.5.7-6")
    include implementation("io.github.spair:imgui-java-binding:${project.imgui_version}")
    include implementation("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}")
    include implementation("io.github.spair:imgui-java-natives-windows:${project.imgui_version}")
    modCompileOnly "com.sk89q.worldedit:worldedit-fabric-mc1.21.11:7.4.2"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.4.20"
    modLocalRuntime files("libs/fabric-language-kotlin.jar")
    runtimeOnly "org.jetbrains.kotlin:kotlin-stdlib:2.4.20"
    runtimeOnly "org.jetbrains.kotlin:kotlin-reflect:2.4.20"
    include modImplementation(group: "net.casual.arcade", name: "arcade-dimensions", version: "0.8.1-beta.8")
    include modImplementation(group: "net.casual.arcade", name: "arcade-event-registry", version: "0.8.1-beta.8")
    include modImplementation(group: "net.casual.arcade", name: "arcade-events-server", version: "0.8.1-beta.8")
    include modImplementation(group: "net.casual.arcade", name: "arcade-extensions", version: "0.8.1-beta.8")
    include modImplementation(group: "net.casual.arcade", name: "arcade-utils", version: "0.8.1-beta.8")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "local"
            url = layout.buildDirectory.dir("repo")
        }
    }
}

def runClientTask = tasks.named("runClient")

runClientTask.configure {
    group = "fabric"
    description = "Starts the Fabric test client with the RhythMC Maker development mod and runtime dependencies."
    mustRunAfter tasks.named("build")
}

def buildTask = tasks.named("build")

tasks.register("buildAndRunClient") {
    group = "fabric"
    description = "Builds the project, then starts the Fabric test client."
    dependsOn buildTask, runClientTask
}


def updateModVersion = { String nextVersion ->
    def propertiesFile = file("gradle.properties")
    def content = propertiesFile.getText("UTF-8")
    def updated = content.replaceFirst(/(?m)^mod_version=.*$/, "mod_version=${nextVersion}")
    if (updated == content) throw new GradleException("mod_version is missing from gradle.properties")
    propertiesFile.write(updated, "UTF-8")
}

tasks.register("bumpPatchVersion") {
    group = "release"
    description = "Increments the c component of mod_version before deployment."
    doLast {
        def parts = project.mod_version.toString().tokenize(".").collect { it as int }
        if (parts.size() != 3) throw new GradleException("mod_version must use a.b.c")
        updateModVersion("${parts[0]}.${parts[1]}.${parts[2] + 1}")
    }
}

tasks.register("bumpMinorVersion") {
    group = "release"
    description = "Increments the b component and resets c for a major feature update."
    doLast {
        def parts = project.mod_version.toString().tokenize(".").collect { it as int }
        if (parts.size() != 3) throw new GradleException("mod_version must use a.b.c")
        updateModVersion("${parts[0]}.${parts[1] + 1}.0")
    }
}

tasks.register("deploy") {
    group = "release"
    description = "Bumps the patch version and builds the deployable mod jar."
    dependsOn "bumpPatchVersion"
    dependsOn buildTask
}

buildTask.configure { mustRunAfter tasks.named("bumpPatchVersion") }
